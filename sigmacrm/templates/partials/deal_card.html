<div class="kanban-card" draggable="true" data-deal-id="{{ deal.pk }}">
    <div class="deal-title">{{ deal.title }}</div>
    <div class="deal-value">${{ deal.value|floatformat:0 }}</div>
    <div class="text-muted-sm mt-1">
        {% if deal.lead %}{{ deal.lead.full_name }}{% endif %}
        {% if deal.expected_close_date %} · {{ deal.expected_close_date|date:"M d" }}{% endif %}
    </div>
    <div class="d-flex justify-content-between align-items-center mt-2">
        <small class="text-muted">{{ deal.assigned_to.get_full_name|default:deal.assigned_to.username|default:"—" }}</small>
        <div>
            <a href="{% url 'deal_edit' deal.pk %}" class="btn btn-sm btn-link p-0"><i class="bi bi-pencil"></i></a>
        </div>
    </div>
</div>
